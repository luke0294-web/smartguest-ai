            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckDbResponse"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckDbResponse"

  /ciao:
    get:
      operationId: ciao
      tags: [misc]
      summary: Legacy plain-text health check (public)
      responses:
        "200":
          description: Server is alive
          content:
            text/plain:
              schema:
                type: string

components:
  parameters:
    CeoSessionHeader:
      name: X-CEO-Session
      in: header
      required: true
      description: HMAC session token from POST /auth/ceo-login
      schema:
        type: string
    HostSessionHeader:
      name: x-host-session
      in: header
      required: true
      description: |
        HMAC session token from POST /auth/host-login. Also accepted via
        `Authorization: Bearer <token>`.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Property:
      type: object
      properties:
        id:
          description: Legacy numeric id (Drizzle) or Supabase UUID string
          oneOf:
            - type: integer
            - type: string
              format: uuid
        slug:
          type: string
        name:
          type: string
        content:
          type: string
        whatsappNumber:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - slug
        - name
        - content
        - whatsappNumber
        - createdAt
        - updatedAt

    ListPropertiesResponseItem:
      description: >-
        Shape returned only by GET /properties (CEO-only list) — adds
        CEO-visible fields not present on the public single-property
        endpoints (GET /properties/{slug}, POST /properties).
      allOf:
        - $ref: "#/components/schemas/Property"
        - type: object
          properties:
            email:
              description: Owner email, or null if the property has no linked host account.
              type: ["string", "null"]
            pendingQuestionsCount:
              type: integer
            hasPassword:
              description: Whether a host password has been set for this property.
              type: boolean
          required:
            - email
            - pendingQuestionsCount
            - hasPassword

    CreatePropertyRequest:
      type: object
      properties:
        slug:
          type: string
          description: Unique URL-friendly identifier (e.g. 'fleming-1')
        name:
          type: string
          description: Human-readable property name
        content:
          type: string
          maxLength: 20000
          description: House rules, WiFi info, tips, etc.
        whatsappNumber:
          type: string
          description: Host WhatsApp number shown to guests
      required:
        - slug
        - name
        - content

    UpdatePropertyRequest:
      type: object
      properties:
        name:
          type: string
        content:
          type: string
          maxLength: 20000
        whatsappNumber:
          type: string
      required: []

    ChatMessageRequest:
      type: object
      properties:
        message:
          type: string
          maxLength: 2000
        conversationHistory:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ConversationMessage"
        language:
          type: string
          description: UI language code (e.g. en, it) for reply language
        city:
          type: string
          maxLength: 50
          description: |
            Demo chat only: city id (e.g. roma, milano) for localized AI context.
            Accepted by validation but not currently read by the handler.
      required:
        - message

    ChatMessageResponse:
      type: object
      properties:
        reply:
          type: string
        propertyName:
          type: string
      required:
        - reply
        - propertyName

    ConversationMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 2000
      required:
        - role
        - content

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    RateLimitedErrorResponse:
      type: object
      properties:
        error:
          type: string
        retryAfter:
          type: number
          description: Seconds until the client may retry
      required:
        - error
        - retryAfter

    ChatRateLimitedResponse:
      description: >-
        Rate-limit response shape specific to the guest chat endpoint — it
        mirrors the success response shape (reply/propertyName) instead of
        the generic ErrorResponse, because the frontend renders it inline as
        an assistant chat bubble rather than as a toast/error banner.
      type: object
      properties:
        reply:
          type: string
          description: Localized, user-facing message shown as the assistant's chat bubble.
        propertyName:
          type: string
        rateLimited:
          type: boolean
          enum: [true]
      required:
        - reply
        - propertyName
        - rateLimited

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    HostOwnedPropertySummary:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
              format: uuid
        slug:
          type: string
        name:
          type: string
        whatsappNumber:
          type: ["string", "null"]
      required:
        - id
        - slug
        - name
        - whatsappNumber

    ChatLog:
      type: object
      properties:
        id:
          type: integer
        propertySlug:
          type: string
        guestMessage:
          type: string
        marcoReply:
          type: string
        createdAt:
          type: string
          format: date-time
        resolved:
          type: boolean
      required:
        - id
        - propertySlug
        - guestMessage
        - marcoReply
        - createdAt
        - resolved

    FullEditPropertyRequest:
      type: object
      properties:
        name:
          type: string
        newSlug:
          type: string
        hostPassword:
          type: string
          description: |
            Empty string clears the property-only password fallback.
            No minimum length is enforced by the schema — the route checks
            it explicitly so an empty string can still mean "clear".
        email:
          type: string
          description: Owner email — reassigns which host account the property belongs to
      required: []

    SetHostPasswordRequest:
      type: object
      properties:
        hostPassword:
          type: string
          minLength: 8
      required:
        - hostPassword

    HostLoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    HostLoginResponse:
      type: object
      properties:
        email:
          type: string
        properties:
          type: array
          items:
            $ref: "#/components/schemas/HostOwnedPropertySummary"
        sessionToken:
          type: string
      required:
        - email
        - properties
        - sessionToken

    HostPropertyResponse:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
              format: uuid
        slug:
          type: string
        name:
          type: string
        content:
          type: string
        whatsappNumber:
          type: ["string", "null"]
        pendingQuestionsCount:
          type: integer
        referralLinks:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        email:
          type: ["string", "null"]
        qrCodeBase64:
          type: string
      required:
        - id
        - slug
        - name
        - content
        - whatsappNumber
        - pendingQuestionsCount
        - createdAt
        - updatedAt
        - email

    HostUpdatePropertyRequest:
      type: object
      properties:
        name:
          type: string
        content:
          type: string
          maxLength: 20000
        whatsappNumber:
          type: string
        referralLinks:
          type: string
      required: []

    PendingQuestionsResetResponse:
      type: object
      properties:
        success:
          type: boolean
        pendingQuestionsCount:
          type: integer
      required:
        - success
        - pendingQuestionsCount

    CeoLoginRequest:
      type: object
      properties:
        password:
          type: string
      required:
        - password

    CeoLoginResponse:
      type: object
      properties:
        token:
          type: string
      required:
        - token

    HostMeResponse:
      type: object
      properties:
        email:
          type: string
        properties:
          type: array
          items:
            $ref: "#/components/schemas/HostOwnedPropertySummary"
      required:
        - email
        - properties

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
      required:
        - email

    TokenValidationResponse:
      type: object
      description: |
        `propertyName`/`slug` are present only when `valid` is true;
        `error` is present only when `valid` is false.
      properties:
        valid:
          type: boolean
        propertyName:
          type: string
        slug:
          type: string
        error:
          type: string
      required:
        - valid

    SetNewPasswordRequest:
      type: object
      properties:
        newPassword:
          type: string
          minLength: 8
      required:
        - newPassword

    PasswordSetResponse:
      type: object
      properties:
        success:
          type: boolean
        slug:
          type: string
      required:
        - success
        - slug

    PendingReset:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        email:
          type: ["string", "null"]
        resetRequestedAt:
          type: ["string", "null"]
          format: date-time
        expired:
          type: boolean
      required:
        - slug
        - name
        - email
        - resetRequestedAt
        - expired

    AiTextResponse:
      type: object
      properties:
        text:
          type: string
      required:
        - text

    CreateLeadRequest:
      type: object
      properties:
        hostName:
          type: string
        email:
          type: string
        propertyName:
          type: string
      required:
        - hostName
        - email
        - propertyName

    LeadStatus:
      type: string
      enum: ["Nuovo", "Contattato", "In Trattativa", "Chiuso", "Non Interessato"]

    Lead:
      type: object
      properties:
        id:
          type: integer
        hostName:
          type: string
        email:
          type: string
        propertyName:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - hostName
        - email
        - propertyName
        - status
        - createdAt

    UpdateLeadStatusRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/LeadStatus"
      required:
        - status

    ConvertLeadResponse:
      type: object
      properties:
        success:
          type: boolean
        slug:
          type: string
        emailSent:
          type: boolean
      required:
        - success
        - slug
        - emailSent

    AdminHost:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - createdAt

    UpsertAdminHostRequest:
      type: object
      properties:
        email:
          type: string
        hostPassword:
          type: string
          minLength: 8
      required:
        - email
        - hostPassword

    UpsertAdminHostResponse:
      type: object
      properties:
        success:
          type: boolean
        email:
          type: string
        action:
          type: string
          enum: [created, updated]
      required:
        - success
        - email
        - action

    AdminPropertySummary:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
              format: uuid
        slug:
          type: string
        name:
          type: string
      required:
        - id
        - slug
        - name

    SendPdfRequest:
      type: object
      properties:
        email:
          type: string
        propertyName:
          type: string
        pdfBase64:
          type: string
          description: PDF file as a base64 string or data URI
        chatLink:
          type: string
      required:
        - email
        - propertyName
        - pdfBase64

    SendPdfResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

    HealthCheckDbResponse:
      type: object
      description: |
        Shape varies: on success, `db: true` with an optional `sample` row.
        On failure, either `message` (production security enabled) or
        `db: false` + `error` (otherwise) — never both.
      properties:
        status:
          type: string
          enum: [ok, error]
        db:
          type: boolean
        sample:
          type: ["object", "null"]
        message:
          type: string
        error:
          type: string
      required:
        - status
