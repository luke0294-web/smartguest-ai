name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Catches CVEs disclosed after the last push — pnpm audit only runs on
    # push/PR otherwise, so a quiet main can go stale on security advisories.
    - cron: "0 6 * * 1"

# Read-only token: CI only checks out code and runs local commands.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          # artifacts/mockup-sandbox's vite.config.ts requires these at build time
          # (dev-convenience gate, not a real secret) — harmless placeholder values.
          PORT: "5174"
          BASE_PATH: "/"
          # rome-guest's production build refuses to run without it (it would
          # ship a blank page) — placeholder only, the CI build is never deployed.
          VITE_API_ORIGIN: "https://api.example.invalid"

      - name: Audit dependencies
        # Runs even if an earlier step failed, so a broken build never hides
        # a new vulnerability (but not when dependencies didn't install).
        if: ${{ !cancelled() && steps.install.outcome != 'failure' }}
        run: pnpm audit --audit-level=high
