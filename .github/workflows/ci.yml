name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Catches CVEs disclosed after the last push — pnpm audit only runs on
    # push/PR otherwise, so a quiet main can go stale on security advisories.
    - cron: "0 6 * * 1"

jobs:
  typecheck-build-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          # artifacts/mockup-sandbox's vite.config.ts requires these at build time
          # (dev-convenience gate, not a real secret) — harmless placeholder values.
          PORT: "5174"
          BASE_PATH: "/"

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
