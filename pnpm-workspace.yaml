packages:
  - artifacts/*
  - lib/*
  - scripts

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^6.1.1
  class-variance-authority: ^0.7.1
  clsx: 2.1.1
  drizzle-orm: 0.45.2
  framer-motion: 13.2.0
  lucide-react: 1.45.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: 3.5.0
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^8.3.0
  zod: 3.25.76

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'

# NOTE: `overrides` and `onlyBuiltDependencies` live ONLY in the root
# package.json ("pnpm" field). pnpm 10 ignores the copies that used to be here
# whenever package.json defines them, so they were dead and misleading.

auditConfig:
  ignoreGhsas:
    # braces 3.0.3: nessuna versione corretta pubblicata (ottobre 2026).
    # Arriva solo da artifacts/mockup-sandbox (fast-glob, devDependency, non va in produzione)
    # e lì riceve solo pattern scritti nel codice, mai input degli utenti.
    # Togliere quando esce una versione corretta o quando mockup-sandbox viene eliminato.
    - GHSA-vfj7-8cjw-p6xm
